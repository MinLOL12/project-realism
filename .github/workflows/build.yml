name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build mod jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Loom caches Minecraft, mappings and the Fabric API artifacts between runs.
      # Without this every build re-downloads a few hundred megabytes.
      - name: Cache Gradle and Loom
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle.properties', 'build.gradle', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace --no-daemon

      # Compile errors land in the log, and the log is not always downloadable. Surface anything
      # that looks like a message from javac as a GitHub annotation so it shows up in the UI.
      - name: Summarise compile errors
        if: failure()
        run: |
          if [ -f build/reports/problems/problems-report.html ]; then
            echo "Gradle problem report present: build/reports/problems/problems-report.html"
          fi
          grep -rhoE "[^ ]+\.java:[0-9]+: error: .*" build/ .gradle/ 2>/dev/null | sort -u | head -50 || true

      - name: Show what was built
        run: ls -lh build/libs

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: project-realism-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

  release:
    name: Attach jar to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: project-realism-jar
          path: dist

      - name: Create release with jar attached
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
