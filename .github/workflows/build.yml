name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build mod jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Loom caches Minecraft, mappings and the Fabric API artifacts between runs.
      # Without this every build re-downloads a few hundred megabytes.
      - name: Cache Gradle and Loom
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle.properties', 'build.gradle', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon --console=plain 2>&1 | tee gradle-build.log

      # Compile errors land in a log that is not always downloadable from CI tooling. Turn each javac
      # message into a workflow annotation (and a job summary) so it is visible in the UI.
      - name: Summarise compile errors
        if: failure()
        run: |
          grep -E "^[^ ]+\.java:[0-9]+: (error|warning): " gradle-build.log \
            | sort -u \
            | while IFS= read -r line; do
                file="${line%%:*}"; rest="${line#*:}"; ln="${rest%%:*}"
                echo "::error file=$file,line=$ln,title=javac::${line//$'\n'/ }"
              done || true
          {
            echo "### Build failed"
            echo '```'
            grep -E "error: |FAILURE: |What went wrong" -A2 gradle-build.log | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show what was built
        run: ls -lh build/libs

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: project-realism-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

  release:
    name: Attach jar to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: project-realism-jar
          path: dist

      - name: Create release with jar attached
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
